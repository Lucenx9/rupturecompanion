[project]
name = "rupture-companion"
version = "0.1.0"
description = "In-game AI companion for StarRupture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9.1,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["ai_backend.py", "daemon.py", "screenshot.py"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true

