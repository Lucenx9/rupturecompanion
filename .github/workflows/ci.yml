name: CI

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - if: runner.os == 'Linux'
        name: Build fixed-purpose KWin screenshot helper
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
          cc -std=c17 -O2 -Wall -Wextra -Werror \
            $(pkg-config --cflags dbus-1) kwin_screenshot_helper.c \
            -o kwin-screenshot-helper $(pkg-config --libs dbus-1)
      - if: runner.os == 'Linux'
        run: shellcheck run-with-companion.sh install-plugin.sh
      - if: runner.os == 'Windows'
        name: Parse PowerShell launch and install scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in 'run-with-companion.ps1', 'install-plugin.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: AlienXAXS/StarRupture-Plugin-SDK
          ref: a3f37a6638be19d0a40fdaba117b03558b20c720
          path: plugin-sdk
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: AlienXAXS/StarRupture-Game-SDK
          ref: 2c7d138506e42011d1ccf4ee044339c154b45b90
          path: game-sdk
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Build current interface
        shell: pwsh
        run: |
          msbuild RuptureCompanion.sln `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:GameSDKRoot="${{ github.workspace }}\game-sdk" `
            /p:PluginSDKInclude="${{ github.workspace }}\plugin-sdk\include" `
            /m /v:minimal
      - if: github.event_name == 'pull_request'
        name: Stage current plugin for smoke testing
        shell: pwsh
        run: |
          Copy-Item "build\Client Release\Plugins\RuptureCompanion.dll" RuptureCompanion-CI.dll
          Copy-Item "build\Client Release\Plugins\RuptureCompanion.pdb" RuptureCompanion-CI.pdb
      - if: github.event_name == 'pull_request'
        name: Upload current plugin for smoke testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RuptureCompanion-current-${{ github.sha }}
          path: |
            RuptureCompanion-CI.dll
            RuptureCompanion-CI.pdb
          if-no-files-found: error
          retention-days: 7
      - name: Download legacy v47 interface
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force legacy-sdk\include | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/AlienXAXS/StarRupture-ModLoader/b3fa2fae7b9b48f7c7bf98ceeb1ab83ef2f0f59d/StarRupture-ModLoader-Core/plugins/plugin_interface.h" `
            -OutFile legacy-sdk\include\plugin_interface.h
      - name: Build legacy interface
        shell: pwsh
        run: |
          msbuild RuptureCompanion.sln /t:Rebuild `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:GameSDKRoot="${{ github.workspace }}\game-sdk" `
            /p:PluginSDKInclude="${{ github.workspace }}\legacy-sdk\include" `
            /m /v:minimal
